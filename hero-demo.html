<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首屏改版演示 · 视频不裁剪 + 毛玻璃介绍</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;900&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Noto+Sans+SC:wght@500;900&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet" />

<style>
/* ==========================================================
   本地演示：只为看效果，样式全部内联，不碰 assets/site.css
   ========================================================== */
:root{
  --paper:#FDFBF7;
  --ink:#0F0F0F;
  --signal:#FF4D1C;
  --electric:#1A3FD9;
  --sand:#E8E4DA;

  --sans:'Archivo','Noto Sans SC','Arial Black','Helvetica Neue','PingFang SC',sans-serif;
  --serif:'Newsreader','Noto Serif SC',Georgia,'Songti SC',serif;

  --measure:1180px;
  --gutter:1.5rem;

  /* 可调参数，右下角面板实时改 */
  --glass-alpha:.62;
  --glass-blur:24px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:clamp(1rem,.95rem + .3vw,1.15rem);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit}
::selection{background:var(--signal);color:var(--paper)}
:focus-visible{outline:3px solid var(--electric);outline-offset:3px}
.wrap{width:min(var(--measure),100% - var(--gutter) * 2);margin-inline:auto}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  background:var(--sand);
  display:grid;
  place-items:center;
}

/* .film = 视频真实画面的盒子，横向撑满 + 永远 16:9，所以画面一格都不裁 */
.film{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  overflow:hidden;
}
.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;     /* 关键：不裁剪 */
  object-position:center;
  display:block;
}

/* 顶栏浮在画面上，深色字压在浅橙画面上足够清楚 */
.topbar{
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  z-index:6;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:var(--gutter);
  padding-top:1.6rem;
  font-family:var(--sans);
  font-size:.82rem;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--ink);
  text-shadow:0 1px 10px rgba(253,251,247,.65);
}
.topbar .mark{text-decoration:none;white-space:nowrap}
.topbar nav{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem}
.topbar a{
  text-decoration:none;
  padding-bottom:2px;
  border-bottom:1.5px solid transparent;
  transition:border-color .18s;
}
.topbar a:hover{border-bottom-color:currentColor}

/* ---------- 白色毛玻璃：介绍盖在视频下部 ---------- */
.glass{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:4;
  color:var(--ink);
  background:rgba(253,251,247,var(--glass-alpha));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
  backdrop-filter:blur(var(--glass-blur)) saturate(150%);
  padding-block:1.5rem 1.6rem;
}
/* 浏览器不支持毛玻璃时退回接近不透明，保证可读 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(253,251,247,.93)}
}
.glass-in{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:1rem 3rem;
  align-items:end;
}
.hero-name{
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(2.6rem,6.4vw,5.2rem);
  line-height:.86;
  letter-spacing:-.05em;
  white-space:nowrap;
}
.hero-name .latin{
  display:block;
  font-size:.2em;
  font-weight:600;
  letter-spacing:.01em;
  margin-top:.8em;
}
.hero-say{
  font-size:clamp(.98rem,.9rem + .4vw,1.22rem);
  line-height:1.55;
  max-width:32ch;
  padding-bottom:.35rem;
}
.hero-say .quiet{
  display:block;
  margin-top:.6rem;
  font-family:var(--sans);
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.08em;
  line-height:1.6;
}

/* ---------- 形态 A：满宽底带（就是上面的 .glass） ---------- */

/* ---------- 形态 D：现状对照（视频裁剪 + 实色纸带） ---------- */
body[data-mask="current"] .hero{display:block;min-height:100svh;grid-template-rows:none}
body[data-mask="current"] .film{
  aspect-ratio:auto;
  height:calc(100svh - 12.5rem);
  max-height:none;
}
body[data-mask="current"] .hero-video{object-fit:cover;object-position:center 34%}
body[data-mask="current"] .glass{
  position:static;
  background:var(--paper);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  padding-block:2.2rem 2.6rem;
  width:auto;transform:none;
}
body[data-mask="current"] .hero-name{font-size:clamp(3.2rem,9vw,7rem)}

/* ---------- 页脚（和线上一致的蓝细带） ---------- */
.strip{
  background:var(--electric);
  color:var(--paper);
  font-family:var(--sans);
  font-size:.8rem;
  font-weight:600;
  letter-spacing:.05em;
}
.strip-in{
  display:flex;flex-wrap:wrap;align-items:baseline;
  gap:.6rem 2rem;padding-block:1.15rem;
}
.strip-mail{text-decoration:none;font-size:.92rem;border-bottom:1.5px solid transparent}
.strip-mail:hover{border-bottom-color:var(--paper)}
.strip-nav{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem}
.strip-nav a{text-decoration:none;border-bottom:1.5px solid rgba(253,251,247,.35);padding-bottom:1px}
.strip-nav a:hover{border-bottom-color:var(--paper)}
.strip-copy{margin-left:auto;opacity:.65}

/* 下面一段正文，只为演示滚动时首屏的收尾 */
.after{padding-block:clamp(3rem,7vw,5rem)}
.after .eyebrow{
  font-family:var(--sans);font-size:.78rem;font-weight:600;
  letter-spacing:.1em;color:var(--signal);margin-bottom:1.2rem;
}
.after p{max-width:46ch}

/* ---------- 演示控制面板（上线时不要带） ---------- */
.panel{
  position:fixed;
  right:1rem;bottom:1rem;
  z-index:99;
  width:16.5rem;
  max-width:calc(100vw - 2rem);
  font-family:var(--sans);
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  background:rgba(253,251,247,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1.5px solid var(--ink);
  border-radius:14px;
  box-shadow:0 14px 40px rgba(15,15,15,.18);
}
.panel summary{
  cursor:pointer;list-style:none;
  padding:.7rem .9rem;
  display:flex;justify-content:space-between;align-items:center;
}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:'＋';font-weight:700}
.panel[open] summary::after{content:'－'}
.panel-body{padding:0 .9rem .9rem;display:grid;gap:.85rem}
.panel fieldset{border:none;display:grid;gap:.35rem}
.panel legend{font-size:.68rem;letter-spacing:.09em;opacity:.55;margin-bottom:.3rem}
.panel label{display:flex;align-items:center;gap:.45rem;font-weight:500;cursor:pointer}
.panel input[type=range]{width:100%;accent-color:var(--signal)}
.panel input[type=radio],.panel input[type=checkbox]{accent-color:var(--signal)}
.panel .val{opacity:.55;font-weight:500}
.panel .note{font-weight:500;line-height:1.5;opacity:.6;font-size:.68rem}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  .glass-in{grid-template-columns:1fr;gap:.85rem;align-items:start}
  .hero-say{padding-bottom:0}
  .hero-name{font-size:clamp(2.2rem,11vw,3.4rem)}
}
</style>
</head>
<body data-mask="band">

<header class="hero">
  <div class="film">
    <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg">
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>

    <div class="glass">
      <div class="wrap glass-in">
        <h1 class="hero-name">李阳<span class="latin">AI Product Manager</span></h1>
        <p class="hero-say">我做 AI 产品。从一个模糊的想法，到有人真的在用它。
          <span class="quiet">现在在明略科技 · 做妙啊和 Octo</span>
        </p>
      </div>
    </div>
  </div>

  <div class="wrap topbar">
    <a class="mark" href="#">李阳 / JOEY LI</a>
    <nav>
      <a href="#">作品</a>
      <a href="#">简历</a>
      <a href="#contact">联系</a>
    </nav>
  </div>
</header>

<section class="wrap after">
  <p class="eyebrow">往下是原来的内容</p>
  <p>这段只是用来看首屏收尾的位置，演示文件不动线上任何页面。</p>
</section>

<footer class="strip" id="contact">
  <div class="wrap strip-in">
    <a class="strip-mail" href="mailto:joeyli2023@gmail.com">joeyli2023@gmail.com</a>
    <nav class="strip-nav">
      <a href="#">微博</a><a href="#">GitHub</a><a href="#">简历</a><a href="#">作品</a>
    </nav>
    <span class="strip-copy">© 2026 李阳</span>
  </div>
</footer>

<details class="panel" open>
  <summary>演示开关</summary>
  <div class="panel-body">
    <fieldset>
      <legend>版式</legend>
      <label><input type="radio" name="mask" value="band" checked /> A 满宽视频 + 毛玻璃底带</label>
      <label><input type="radio" name="mask" value="current" /> D 现状对照（裁剪）</label>
    </fieldset>

    <fieldset>
      <legend>毛玻璃 白色浓度 <span class="val" id="aVal">0.62</span></legend>
      <input type="range" id="alpha" min="0.25" max="0.95" step="0.01" value="0.62" />
    </fieldset>

    <fieldset>
      <legend>模糊半径 <span class="val" id="bVal">24px</span></legend>
      <input type="range" id="blur" min="0" max="48" step="1" value="24" />
    </fieldset>

    <p class="note">本地演示文件 hero-demo.html，线上文件未改动。</p>
  </div>
</details>

<script>
var body = document.body, root = document.documentElement;

document.querySelectorAll('input[name=mask]').forEach(function (r) {
  r.addEventListener('change', function () { body.dataset.mask = r.value; });
});

var alpha = document.getElementById('alpha'), aVal = document.getElementById('aVal');
alpha.addEventListener('input', function () {
  root.style.setProperty('--glass-alpha', alpha.value);
  aVal.textContent = alpha.value;
});

var blur = document.getElementById('blur'), bVal = document.getElementById('bVal');
blur.addEventListener('input', function () {
  root.style.setProperty('--glass-blur', blur.value + 'px');
  bVal.textContent = blur.value + 'px';
});

/* 视频自动播放：沿用线上那套兜底逻辑 */
(function () {
  var v = document.querySelector('.hero-video');
  if (!v) return;
  v.muted = true; v.playsInline = true;
  function attempt() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  attempt();
  ['loadeddata', 'canplay'].forEach(function (e) { v.addEventListener(e, attempt); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
    document.addEventListener(e, function once() {
      document.removeEventListener(e, once);
      if (v.paused) attempt();
    }, { passive: true, capture: true });
  });
})();
</script>
</body>
</html>
